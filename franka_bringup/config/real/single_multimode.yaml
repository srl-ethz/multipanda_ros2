paco/controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    
    franka_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster

    multi_mode_controller:
      type: multi_mode_controller/MultiModeController

paco/franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: right

paco/franka_robot_model_broadcaster:
  ros__parameters:
    arm_id: right
    
paco/multi_mode_controller:
  ros__parameters:
    arm_count: 1
    arm_1:
      arm_id: right
    controllers: ["panda_joint_impedance_controller", "panda_cartesian_impedance_controller"]
    resources:
        panda_joint_impedance_controller: ["right"]
        panda_cartesian_impedance_controller: ["right"]
    start_controllers:
        names: ["panda_cartesian_impedance_controller"]
        resources:
            panda_cartesian_impedance_controller: ["right"]
