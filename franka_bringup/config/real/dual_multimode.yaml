paco/controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    
    left_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    
    right_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    
    right_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster

    real_multi_mode_controller:
      type: multi_mode_controller/MultiModeController

paco/left_state_broadcaster:
  ros__parameters:
    arm_id: left
    frequency: 100

paco/left_model_broadcaster:
  ros__parameters:
    arm_id: left
    frequency: 100

paco/right_state_broadcaster:
  ros__parameters:
    arm_id: right
    frequency: 100

paco/right_model_broadcaster:
  ros__parameters:
    arm_id: right
    frequency: 100
    
paco/real_multi_mode_controller:
  ros__parameters:
    arm_count: 2
    arm_1:
      arm_id: left
    arm_2:
      arm_id: right
    controllers: ["panda_joint_impedance_controller",
                  "panda_joint_velocity_controller",
                  "comless_coupled_dual_cartesian_impedance_controller",
                  "dual_cartesian_impedance_controller",
                  "des_coupled_dual_cartesian_impedance_controller",
                  "panda_mpc_controller"]
    resources:
        comless_coupled_dual_cartesian_impedance_controller: ["left&right"]
        dual_cartesian_impedance_controller: ["left&right"]
        des_coupled_dual_cartesian_impedance_controller: ["left&right"]
        panda_joint_impedance_controller: ["left","right"]
        panda_joint_velocity_controller: ["left","right"]
        # Stage-1 Cartesian MPC runs per-arm (one independent instance each).
        panda_mpc_controller: ["left","right"]
    # Coupled dual-cartesian stays the launch default on real hardware; switch
    # to the (experimental) per-arm MPC deliberately via ~/set_controllers.
    start_controllers:
        names: ["dual_cartesian_impedance_controller"]
        resources:
            dual_cartesian_impedance_controller: ["left&right"]
    panda_mpc_controller.command_dt: 0.1
    panda_mpc_controller.reference_filter_tau: 0.0995
