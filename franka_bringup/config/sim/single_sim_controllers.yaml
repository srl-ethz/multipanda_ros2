mujoco_server:
  ros__parameters:
    MujocoPlugins:
      names:
        - mujoco_ros2_control
      mujoco_ros2_control:
        type: mujoco_ros2_control::MujocoRos2ControlPlugin
        hardware:
          type: mujoco_ros_control/RobotHW
          control_period: 0.001
        params:
          namespace: ""
          robot_description_node: "robot_state_publisher"
          robot_description: "robot_description"

controller_manager:
    ros__parameters:
      update_rate: 1000
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
      franka_robot_model_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
      joint_impedance_example_controller:
        type: franka_example_controllers/JointImpedanceExampleController
      cartesian_impedance_example_controller:
        type: franka_example_controllers/CartesianImpedanceExampleController
      multi_mode_controller:
        type: multi_mode_controller/MultiModeController
franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda
    frequency: 60
    
franka_robot_model_broadcaster:
  ros__parameters:
    arm_id: panda
    frequency: 60

joint_impedance_example_controller:
  ros__parameters:
    arm_id: panda
    k_gains:
      - 24.0
      - 24.0
      - 24.0
      - 24.0
      - 10.0
      - 6.0
      - 2.0
    d_gains:
      - 2.0
      - 2.0
      - 2.0
      - 1.0
      - 1.0
      - 1.0
      - 0.5

cartesian_impedance_example_controller:
  ros__parameters:
    arm_id: panda
  
multi_mode_controller:
  ros__parameters:
    arm_count: 1
    arm_1:
      arm_id: panda
    controllers: ["panda_joint_impedance_controller", "panda_cartesian_impedance_controller", "panda_mpc_controller"]
    resources:
        panda_joint_impedance_controller: ["panda"]
        panda_cartesian_impedance_controller: ["panda"]
        panda_mpc_controller: ["panda"]
    start_controllers:
        names: ["panda_mpc_controller"]
        resources:
            panda_mpc_controller: ["panda"]
    # Stage-1 Cartesian MPC controllet. Switch to it at runtime via the
    # ~/set_controllers service. Spacing (s) between consecutive commanded
    # waypoints on /panda/arm/mpc_end_effector_pose_cmd:
    panda_mpc_controller.command_dt: 0.1
    # Reference model shaping the single-pose end_effector_pose_cmd path so the
    # closed loop reproduces panda_cartesian_impedance_controller's
    # command->motion dynamics (for policies trained on that controller).
    # Tuned against a measured 2 cm chirp; max_accel reproduces the impedance
    # law's 15 N static-force clamp, which is what limits its large-step speed.
    panda_mpc_controller.reference_model.omega_n: 8.0
    panda_mpc_controller.reference_model.zeta: 1.48
    # Saturated approach speed = max_accel / (2*zeta*omega_n):
    #   2.13 / 23.7 = 0.090 m/s, matching the impedance law's measured
    #   large-step speed (its 15 N clamp against the task damping).
    panda_mpc_controller.reference_model.max_accel: 3.5
    # Rotation saturates through the impedance law's +-0.2 rad error clip
    # (20 Nm/rad * 0.2 = 4 Nm), giving ~0.40 rad/s on a large turn.
    panda_mpc_controller.reference_model.max_accel_rot: 20.0
